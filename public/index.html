<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LeadMatch - teste</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1c1c1c">

<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">

<!-- iOS: sem essas tags, "Adicionar à Tela de Início" abre como atalho de
     Safari (com barra de endereço), não como app em tela cheia -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LeadMatch">

<style>
  :root {
    --bg: #1c1c1c;
    --bg-card: #262626;
    --bg-input: #202020;
    --border: #3a3a3a;
    --text: #e8e6e2;
    --text-muted: #9a958c;
    --amber-dark: #412402;
    --amber-light: #FAC775;
    --erro: #e08066;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: calc(40px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: var(--bg);
    color: var(--text);
  }

  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  h3 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }

  p { color: var(--text-muted); }

  textarea, input {
    width: 100%;
    font-size: 15px;
    padding: 8px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
  }

  textarea { height: 80px; }

  textarea:focus, input:focus {
    outline: none;
    border-color: var(--amber-light);
  }

  button {
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 8px;
    margin-right: 8px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--amber-light);
    background: var(--amber-light);
    color: var(--amber-dark);
  }

  button.secundario {
    background: transparent;
    color: var(--amber-light);
  }

  .card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 16px;
    background: var(--bg-card);
  }

  label { display: block; margin-top: 10px; font-size: 12px; color: var(--text-muted); }

  .match {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    background: var(--bg-input);
  }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-right: 6px;
  }

  .badge-vendedor { background: var(--amber-light); color: var(--amber-dark); }
  .badge-comprador { background: var(--amber-dark); color: var(--amber-light); }

  .chip {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .erro { color: var(--erro); }

  .alerta-erro {
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid var(--erro);
    border-radius: 8px;
    background: rgba(224, 128, 102, 0.12);
    color: var(--erro);
    font-size: 13px;
  }

  .topo { display: flex; justify-content: space-between; align-items: center; }

  .abas {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .abas button {
    flex: 1;
    margin: 0;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
  }
  .abas button.ativa {
    background: var(--amber-light);
    border-color: var(--amber-light);
    color: var(--amber-dark);
  }

  button:disabled { opacity: 0.6; cursor: default; }

  #tela-auth {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
    background: var(--bg);
    padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
              calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }

  .auth-caixa { width: 100%; max-width: 360px; text-align: center; }
  .auth-caixa .card { text-align: left; }

  .auth-titulo { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .auth-titulo h1 { margin: 0; }
  .auth-titulo .logo {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    border: 1px solid var(--border);
  }

  select {
    font-size: 14px;
    padding: 8px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
  }

  .filtros { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }

  .chip-filtro {
    padding: 5px 12px;
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
  }

  .chip-filtro.ativo {
    border-color: var(--amber-light);
    background: var(--amber-light);
    color: var(--amber-dark);
  }

  .lead-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    background: var(--bg-input);
  }

  .lead-card.fechado { opacity: 0.6; }

  .lead-card .lead-card-linha { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }

  .lead-card .lead-nome { display: flex; align-items: center; gap: 8px; font-weight: 600; }

  .lead-card .lead-info { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-muted); }

  .lead-card .lead-valor { font-weight: 600; color: var(--amber-light); }

  .lead-card .lead-card-acoes { display: flex; flex-wrap: wrap; gap: 6px; }

  .btn-mini {
    padding: 5px 10px;
    margin: 0;
    font-size: 12px;
  }

  .btn-mini.perigo { border-color: var(--erro); color: var(--erro); }

  .chip-fechado {
    padding: 2px 8px;
    font-size: 10px;
  }

  .lead-matches { margin-top: -2px; }
  .lead-matches .match { margin-top: 6px; }

  input[type="checkbox"] { width: auto; }

  .opcao-checkbox {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--text);
    margin-top: 8px;
    margin-right: 14px;
  }

  .tag-removivel {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text);
    margin: 6px 6px 0 0;
  }
  .tag-removivel button {
    all: unset;
    cursor: pointer;
    color: var(--text-muted);
    font-weight: 700;
    padding: 0 4px;
  }

  .chip-pequeno { padding: 2px 8px; font-size: 10px; }

  /* input ao lado de um botão de ação: o input ocupa o espaço disponível,
     o botão nunca quebra linha (senão o texto do botão espreme e quebra) */
  .linha-input-botao { display: flex; gap: 6px; margin-top: 6px; }
  .linha-input-botao input { flex: 1; min-width: 0; }
  .linha-input-botao button { flex-shrink: 0; white-space: nowrap; }

  /* telas estreitas: abas com texto maior que o espaço quebram linha e
     ficam com altura desigual — reduz fonte/padding pra caber numa linha */
  @media (max-width: 400px) {
    .abas button { font-size: 13px; padding: 10px 6px; }
  }
</style>
</head>
<body>

  <div id="tela-auth">
    <div class="auth-caixa">
      <div class="auth-titulo">
        <img src="/icons/icon-192.png" alt="" class="logo">
        <h1>LeadMatch</h1>
      </div>
      <p>Entre com sua conta de corretor ou cadastre uma nova:</p>
      <div class="abas">
        <button id="aba-login" class="ativa" onclick="mostrarAba('login')">Entrar</button>
        <button id="aba-cadastro" onclick="mostrarAba('cadastro')">Cadastrar</button>
      </div>
      <div class="card">
        <div id="campo-nome-auth" style="display:none">
          <label>Nome</label>
          <input id="auth_nome" placeholder="seu nome">
        </div>
        <label>E-mail</label>
        <input id="auth_email" type="email" placeholder="seu@email.com">
        <label>Senha</label>
        <input id="auth_senha" type="password" placeholder="sua senha">
        <button id="botao-auth" onclick="enviarAuth()">Entrar</button>
        <div id="auth-erro"></div>
      </div>
    </div>
  </div>

  <div id="tela-onboarding" style="display:none">
    <div class="auth-caixa" style="max-width:420px;">
      <div class="auth-titulo">
        <img src="/icons/icon-192.png" alt="" class="logo">
        <h1>Quase lá</h1>
      </div>
      <p>Isso ajuda a sugerir etiquetas automaticamente quando você cadastra um lead.</p>
      <div class="card">
        <label>Com o que você trabalha?</label>
        <div class="filtros">
          <label class="opcao-checkbox"><input type="checkbox" value="terreno" class="onboarding-molde"> Terreno</label>
          <label class="opcao-checkbox"><input type="checkbox" value="ferro_lote" class="onboarding-molde"> Ferro em lote</label>
          <label class="opcao-checkbox"><input type="checkbox" value="estrutura_metalica" class="onboarding-molde"> Estrutura metálica</label>
          <label class="opcao-checkbox"><input type="checkbox" class="onboarding-molde-outro"> Outro (descreva abaixo)</label>
        </div>

        <label>Palavras-chave que quer acompanhar (opcional)</label>
        <input id="onboarding-palavra-input" placeholder="digite e pressione Enter"
               onkeydown="if(event.key==='Enter'){event.preventDefault();adicionarPalavraChaveOnboarding();}">
        <div id="onboarding-palavras-chips"></div>

        <button id="botao-onboarding" onclick="enviarOnboarding()">Continuar</button>
        <button class="secundario" onclick="pularOnboarding()">Pular por enquanto</button>
        <div id="onboarding-erro"></div>
      </div>
    </div>
  </div>

  <div id="tela-app" style="display:none">
    <div class="topo">
      <h1>LeadMatch</h1>
      <div><span id="corretor-nome" class="chip"></span> <button class="secundario" onclick="sair()">Sair</button></div>
    </div>

    <div class="abas">
      <button id="aba-processar" class="ativa" onclick="mostrarAbaApp('processar')">Processar mensagem</button>
      <button id="aba-meusleads" onclick="mostrarAbaApp('meusleads')">Meus leads</button>
    </div>

    <div id="view-processar">
      <p>Cole a mensagem do corretor como ela chegaria no WhatsApp:</p>
      <textarea id="mensagem" placeholder="Ex: tenho um terreno industrial em Atibaia, 6 mil m2, quero 850 mil nele"></textarea>
      <br>
      <button onclick="processar()">Processar mensagem</button>
      <button class="secundario" onclick="preencherManualmente()">Preencher manualmente</button>

      <div id="resultado"></div>
    </div>

    <div id="view-meusleads" style="display:none">
      <input id="busca-leads" placeholder="Buscar por nome ou cidade..." oninput="renderizarLeads()">

      <div class="filtros" id="filtros-categoria"></div>

      <div class="filtros" id="filtros-papel">
        <button class="chip-filtro ativo" data-valor="todos" onclick="definirFiltroPapel('todos', this)">Todos</button>
        <button class="chip-filtro" data-valor="comprador" onclick="definirFiltroPapel('comprador', this)">Comprador</button>
        <button class="chip-filtro" data-valor="vendedor" onclick="definirFiltroPapel('vendedor', this)">Vendedor</button>
      </div>

      <div class="filtros" id="filtros-tipo">
        <button class="chip-filtro ativo" data-valor="todos" onclick="definirFiltroTipo('todos', this)">Todos</button>
        <button class="chip-filtro" data-valor="terreno" onclick="definirFiltroTipo('terreno', this)">Terreno</button>
        <button class="chip-filtro" data-valor="ferro_lote" onclick="definirFiltroTipo('ferro_lote', this)">Ferro em lote</button>
        <button class="chip-filtro" data-valor="estrutura_metalica" onclick="definirFiltroTipo('estrutura_metalica', this)">Estrutura metálica</button>
      </div>

      <div class="filtros">
        <label style="margin:0;">Ordenar por
          <select id="ordenacao-leads" onchange="renderizarLeads()">
            <option value="recente">Mais recente</option>
            <option value="valor">Valor</option>
          </select>
        </label>
      </div>

      <div id="lista-leads"></div>
    </div>
  </div>

  <script>
    let dadosAtuais = null;
    let abaAtual = 'login';
    let leadsCache = [];
    let filtroPapel = 'todos';
    let filtroTipo = 'todos';
    let filtroCategoria = 'todos';
    let categoriasCache = [];
    let palavrasChaveOnboarding = [];
    let nomeCorretorAtual = '';

    const tipoLabel = {
      terreno: 'Terreno',
      ferro_lote: 'Ferro em lote',
      estrutura_metalica: 'Estrutura metálica',
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(console.error);
      });
    }

    async function verificarSessao() {
      const res = await fetch('/auth/me');
      const data = await res.json();
      if (data.logado) {
        entrarNaTelaApp(data.nome, data.onboardingConcluido);
      } else {
        document.getElementById('tela-auth').style.display = '';
        document.getElementById('tela-onboarding').style.display = 'none';
        document.getElementById('tela-app').style.display = 'none';
      }
    }

    function entrarNaTelaApp(nome, onboardingConcluido) {
      nomeCorretorAtual = nome;
      document.getElementById('tela-auth').style.display = 'none';
      if (!onboardingConcluido) {
        document.getElementById('tela-onboarding').style.display = '';
        return;
      }
      mostrarTelaApp(nome);
    }

    async function mostrarTelaApp(nome) {
      document.getElementById('tela-onboarding').style.display = 'none';
      document.getElementById('tela-app').style.display = '';
      document.getElementById('corretor-nome').textContent = nome;
      await carregarCategorias();
    }

    // mesmas regras validadas no servidor (auth.js); aqui é só pra dar
    // feedback rápido sem esperar o round-trip.
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const SENHA_REGEX = /^(?=.*[A-Z])(?=.*\d).{8,}$/;

    function mostrarAba(aba) {
      abaAtual = aba;
      document.getElementById('aba-login').classList.toggle('ativa', aba === 'login');
      document.getElementById('aba-cadastro').classList.toggle('ativa', aba === 'cadastro');
      document.getElementById('botao-auth').textContent = aba === 'login' ? 'Entrar' : 'Cadastrar';
      document.getElementById('campo-nome-auth').style.display = aba === 'cadastro' ? '' : 'none';
      document.getElementById('auth_senha').placeholder = aba === 'cadastro' ? 'mín. 8 caracteres, 1 maiúscula, 1 número' : 'sua senha';
      document.getElementById('auth-erro').innerHTML = '';
    }

    async function enviarAuth() {
      const nome = document.getElementById('auth_nome').value.trim();
      const email = document.getElementById('auth_email').value.trim();
      const senha = document.getElementById('auth_senha').value;
      const erroDiv = document.getElementById('auth-erro');
      erroDiv.innerHTML = '';

      if (!email || !senha || (abaAtual === 'cadastro' && !nome)) {
        erroDiv.innerHTML = '<div class="alerta-erro">Preencha todos os campos.</div>';
        return;
      }
      if (!EMAIL_REGEX.test(email)) {
        erroDiv.innerHTML = '<div class="alerta-erro">Informe um e-mail válido (com @ e domínio, ex: nome@exemplo.com).</div>';
        return;
      }
      if (abaAtual === 'cadastro' && !SENHA_REGEX.test(senha)) {
        erroDiv.innerHTML = '<div class="alerta-erro">A senha precisa ter no mínimo 8 caracteres, com pelo menos 1 letra maiúscula e 1 número.</div>';
        return;
      }

      const botao = document.getElementById('botao-auth');
      const textoOriginal = botao.textContent;
      botao.disabled = true;
      botao.textContent = abaAtual === 'login' ? 'Entrando...' : 'Cadastrando...';

      const rota = abaAtual === 'login' ? '/auth/login' : '/auth/cadastro';
      const payload = abaAtual === 'login' ? { email, senha } : { nome, email, senha };
      try {
        const res = await fetch(rota, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.erro) throw new Error(data.erro);
        entrarNaTelaApp(data.nome, data.onboardingConcluido);
      } catch (e) {
        erroDiv.innerHTML = `<div class="alerta-erro">${e.message}</div>`;
        botao.disabled = false;
        botao.textContent = textoOriginal;
      }
    }

    async function sair() {
      await fetch('/auth/logout', { method: 'POST' });
      document.getElementById('auth_nome').value = '';
      document.getElementById('auth_email').value = '';
      document.getElementById('auth_senha').value = '';
      document.getElementById('resultado').innerHTML = '';
      leadsCache = [];
      categoriasCache = [];
      verificarSessao();
    }

    function adicionarPalavraChaveOnboarding() {
      const input = document.getElementById('onboarding-palavra-input');
      const valor = input.value.trim();
      input.value = '';
      if (!valor || palavrasChaveOnboarding.includes(valor)) return;
      palavrasChaveOnboarding.push(valor);
      renderizarPalavrasChaveOnboarding();
    }

    function removerPalavraChaveOnboarding(valor) {
      palavrasChaveOnboarding = palavrasChaveOnboarding.filter(p => p !== valor);
      renderizarPalavrasChaveOnboarding();
    }

    function renderizarPalavrasChaveOnboarding() {
      document.getElementById('onboarding-palavras-chips').innerHTML = palavrasChaveOnboarding.map(p => `
        <span class="tag-removivel">${p}<button type="button" onclick='removerPalavraChaveOnboarding(${JSON.stringify(p)})'>×</button></span>
      `).join('');
    }

    async function enviarOnboarding() {
      const moldes = [...document.querySelectorAll('.onboarding-molde:checked')].map(el => el.value);
      const erroDiv = document.getElementById('onboarding-erro');
      erroDiv.innerHTML = '';

      const botao = document.getElementById('botao-onboarding');
      botao.disabled = true;
      botao.textContent = 'Salvando...';

      try {
        const res = await fetch('/onboarding', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ moldes, palavrasChave: palavrasChaveOnboarding }),
        });
        if (res.status === 401) return verificarSessao();
        const data = await res.json();
        if (data.erro) throw new Error(data.erro);
        categoriasCache = data.categorias;
        mostrarTelaApp(nomeCorretorAtual);
      } catch (e) {
        erroDiv.innerHTML = `<div class="alerta-erro">${e.message}</div>`;
      } finally {
        botao.disabled = false;
        botao.textContent = 'Continuar';
      }
    }

    async function pularOnboarding() {
      await fetch('/onboarding', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ moldes: [], palavrasChave: [] }),
      });
      mostrarTelaApp(nomeCorretorAtual);
    }

    verificarSessao();

    function mostrarAbaApp(aba) {
      document.getElementById('aba-processar').classList.toggle('ativa', aba === 'processar');
      document.getElementById('aba-meusleads').classList.toggle('ativa', aba === 'meusleads');
      document.getElementById('view-processar').style.display = aba === 'processar' ? '' : 'none';
      document.getElementById('view-meusleads').style.display = aba === 'meusleads' ? '' : 'none';
      if (aba === 'meusleads') carregarMeusLeads();
    }

    async function carregarMeusLeads() {
      const listaDiv = document.getElementById('lista-leads');
      listaDiv.innerHTML = '<p>Carregando...</p>';
      const res = await fetch('/leads');
      if (res.status === 401) return verificarSessao();
      leadsCache = await res.json();
      renderizarLeads();
    }

    function definirFiltroPapel(valor, botao) {
      filtroPapel = valor;
      document.querySelectorAll('#filtros-papel .chip-filtro').forEach(b => b.classList.remove('ativo'));
      botao.classList.add('ativo');
      renderizarLeads();
    }

    function definirFiltroTipo(valor, botao) {
      filtroTipo = valor;
      document.querySelectorAll('#filtros-tipo .chip-filtro').forEach(b => b.classList.remove('ativo'));
      botao.classList.add('ativo');
      renderizarLeads();
    }

    async function carregarCategorias() {
      const res = await fetch('/categorias');
      if (res.status === 401) return verificarSessao();
      categoriasCache = await res.json();
      renderizarFiltrosCategoria();
    }

    function renderizarFiltrosCategoria() {
      const container = document.getElementById('filtros-categoria');
      if (!container) return;
      const chipTodas = `<button class="chip-filtro${filtroCategoria === 'todos' ? ' ativo' : ''}" data-valor="todos" onclick="definirFiltroCategoria('todos', this)">Todas</button>`;
      const chips = categoriasCache.map(c => `
        <button class="chip-filtro${filtroCategoria === c.nome ? ' ativo' : ''}" data-valor="${c.nome}" onclick='definirFiltroCategoria(${JSON.stringify(c.nome)}, this)'>${tipoLabel[c.nome] || c.nome}</button>
      `).join('');
      container.innerHTML = chipTodas + chips;
    }

    function definirFiltroCategoria(valor, botao) {
      filtroCategoria = valor;
      document.querySelectorAll('#filtros-categoria .chip-filtro').forEach(b => b.classList.remove('ativo'));
      botao.classList.add('ativo');
      renderizarLeads();
    }

    function valorPrincipal(lead) {
      if (lead.tipo === 'ferro_lote') return lead.preco_kg;
      return lead.valor_total;
    }

    function formatarValor(lead) {
      const valor = valorPrincipal(lead);
      if (valor == null) return '—';
      const valorFormatado = Number(valor).toLocaleString('pt-BR');
      return lead.tipo === 'ferro_lote' ? `R$ ${valorFormatado}/kg` : `R$ ${valorFormatado}`;
    }

    function renderizarLeads() {
      const busca = document.getElementById('busca-leads').value.trim().toLowerCase();
      const ordenacao = document.getElementById('ordenacao-leads').value;
      const listaDiv = document.getElementById('lista-leads');

      let leads = leadsCache.filter(lead => {
        if (filtroPapel !== 'todos' && lead.papel !== filtroPapel) return false;
        if (filtroTipo !== 'todos' && lead.tipo !== filtroTipo) return false;
        if (filtroCategoria !== 'todos' && !(lead.categorias || []).includes(filtroCategoria)) return false;
        if (busca) {
          const nome = (lead.nome || '').toLowerCase();
          const cidade = (lead.cidade || '').toLowerCase();
          if (!nome.includes(busca) && !cidade.includes(busca)) return false;
        }
        return true;
      });

      if (ordenacao === 'valor') {
        leads = leads.slice().sort((a, b) => (valorPrincipal(b) ?? -Infinity) - (valorPrincipal(a) ?? -Infinity));
      } else {
        leads = leads.slice().sort((a, b) => b.id - a.id);
      }

      if (!leads.length) {
        listaDiv.innerHTML = '<p>Nenhum lead encontrado.</p>';
        return;
      }

      listaDiv.innerHTML = leads.map(lead => `
        <div class="lead-card ${lead.status === 'fechado' ? 'fechado' : ''}">
          <div class="lead-card-linha">
            <div class="lead-nome">
              <span class="badge badge-${lead.papel}">${lead.papel}</span>
              ${lead.nome || '(sem nome)'}
              ${lead.status === 'fechado' ? '<span class="chip chip-fechado">Fechado</span>' : ''}
            </div>
            <div class="lead-info">
              <span>${tipoLabel[lead.tipo] || lead.tipo}</span>
              <span>${lead.cidade || '—'}</span>
              <span class="lead-valor">${formatarValor(lead)}</span>
            </div>
          </div>
          ${(lead.categorias && lead.categorias.length) ? `<div class="lead-info">${lead.categorias.map(c => `<span class="chip chip-pequeno">${tipoLabel[c] || c}</span>`).join('')}</div>` : ''}
          <div class="lead-card-acoes">
            <button class="secundario btn-mini" onclick="verMatches(${lead.id})">Ver matches</button>
            <button class="secundario btn-mini" onclick="editarLead(${lead.id})">Editar</button>
            ${lead.status !== 'fechado' ? `<button class="secundario btn-mini" onclick="marcarFechado(${lead.id})">Marcar como fechado</button>` : ''}
            <button class="secundario btn-mini perigo" onclick="excluirLead(${lead.id})">Excluir</button>
          </div>
          <div class="lead-matches" id="matches-${lead.id}"></div>
        </div>
      `).join('');
    }

    async function verMatches(id) {
      const container = document.getElementById(`matches-${id}`);
      if (container.dataset.aberto === '1') {
        container.innerHTML = '';
        container.dataset.aberto = '0';
        return;
      }

      container.innerHTML = '<p>Buscando matches...</p>';
      const res = await fetch(`/leads/${id}/matches`);
      if (res.status === 401) return verificarSessao();
      const data = await res.json();
      if (data.erro) {
        container.innerHTML = `<p class="erro">${data.erro}</p>`;
        return;
      }

      container.dataset.aberto = '1';
      if (!data.matches.length) {
        container.innerHTML = '<p>Nenhum match encontrado.</p>';
        return;
      }
      container.innerHTML = data.matches.map(m => `
        <div class="match"><span class="badge badge-${m.papel}">${m.papel}</span>${m.nome || '(sem nome)'} — diferença: ${m.diferenca}</div>
      `).join('');
    }

    async function marcarFechado(id) {
      if (!confirm('Marcar esse lead como fechado? Ele para de entrar nas buscas de match.')) return;
      const res = await fetch(`/leads/${id}/fechar`, { method: 'POST' });
      if (res.status === 401) return verificarSessao();
      await carregarMeusLeads();
    }

    async function excluirLead(id) {
      if (!confirm('Excluir esse lead? Essa ação não pode ser desfeita.')) return;
      const res = await fetch(`/leads/${id}`, { method: 'DELETE' });
      if (res.status === 401) return verificarSessao();
      await carregarMeusLeads();
    }

    function editarLead(id) {
      const lead = leadsCache.find(l => l.id === id);
      if (!lead) return;

      dadosAtuais = {
        tipo: lead.tipo, nome: lead.nome, papel: lead.papel, cidade: lead.cidade, etiqueta: lead.etiqueta,
        area_m2: lead.area_m2, valor_total: lead.valor_total, toneladas: lead.toneladas, preco_kg: lead.preco_kg,
        comprimento_m: lead.comprimento_m, largura_m: lead.largura_m,
      };
      mostrarAbaApp('processar');
      mostrarFormularioConfirmacao(dadosAtuais, lead.mensagem_original || '', lead.id, lead.categorias || []);
    }

    async function processar() {
      const texto = document.getElementById('mensagem').value.trim();
      if (!texto) return;

      const resDiv = document.getElementById('resultado');
      resDiv.innerHTML = '<p>Processando...</p>';

      try {
        const res = await fetch('/processar-mensagem', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto }),
        });
        if (res.status === 401) return verificarSessao();
        const data = await res.json();
        if (data.erro) throw new Error(data.erro);

        dadosAtuais = data.dadosExtraidos;
        mostrarFormularioConfirmacao(dadosAtuais, texto);
      } catch (e) {
        resDiv.innerHTML = `<p class="erro">Erro: ${e.message}</p>`;
      }
    }

    function preencherManualmente() {
      dadosAtuais = {
        tipo: '', nome: '', papel: '', cidade: '', etiqueta: '',
        area_m2: '', valor_total: '', toneladas: '', preco_kg: '',
        comprimento_m: '', largura_m: '',
      };
      mostrarFormularioConfirmacao(dadosAtuais, '(preenchido manualmente, sem IA)');
    }

    function mostrarFormularioConfirmacao(dados, mensagemOriginal, idEdicao = null, categoriasAtivas = null) {
      const campos = Object.keys(dados).filter(k => k !== 'campos_faltando');
      let html = `<div class="card"><h3>${idEdicao ? 'Editar lead' : 'Confira e confirme'}:</h3>`;
      if (dados.campos_faltando && dados.campos_faltando.length) {
        html += `<p class="erro">Faltando: ${dados.campos_faltando.join(', ')}</p>`;
      }
      const dicas = {
        tipo: 'terreno | ferro_lote | estrutura_metalica',
        papel: 'comprador | vendedor',
      };
      campos.forEach(campo => {
        const placeholder = dicas[campo] ? ` placeholder="${dicas[campo]}"` : '';
        html += `<label>${campo}</label><input id="campo_${campo}" value="${dados[campo] ?? ''}"${placeholder}>`;
      });

      const ativas = categoriasAtivas || sugerirCategorias(dados, mensagemOriginal);
      html += '<label>Categorias</label><div class="filtros" id="categorias-lead">';
      html += categoriasCache.map(c => {
        const ativo = ativas.includes(c.nome) ? ' ativo' : '';
        return `<button type="button" class="chip-filtro${ativo}" data-nome="${c.nome}" onclick="this.classList.toggle('ativo')">${tipoLabel[c.nome] || c.nome}</button>`;
      }).join('');
      html += '</div>';
      html += `
        <div class="linha-input-botao">
          <input id="nova-categoria-lead" placeholder="nova categoria..."
                 onkeydown="if(event.key==='Enter'){event.preventDefault();adicionarNovaCategoriaAoForm();}">
          <button type="button" class="secundario btn-mini" onclick="adicionarNovaCategoriaAoForm()">+ Adicionar</button>
        </div>`;

      html += `<button onclick='confirmar(${JSON.stringify(mensagemOriginal)}, ${idEdicao ?? 'null'})'>${idEdicao ? 'Salvar alterações' : 'Confirmar lead'}</button></div>`;
      document.getElementById('resultado').innerHTML = html;

      religarSugestaoCategorias(dados);
    }

    // compara o texto do lead (mensagem + campos) com o nome de cada categoria
    // do corretor; usado pra pré-marcar sugestões automaticamente.
    function sugerirCategorias(dados, mensagemOriginal) {
      const texto = [mensagemOriginal, dados.nome, dados.cidade, dados.tipo, dados.etiqueta]
        .filter(Boolean)
        .join(' ')
        .toLowerCase();
      return categoriasCache.filter(c => texto.includes(c.nome.toLowerCase())).map(c => c.nome);
    }

    // reavalia as sugestões conforme o corretor digita (preenchimento manual);
    // só ATIVA chips que passam a bater, nunca desativa o que o corretor já escolheu.
    function religarSugestaoCategorias(dados) {
      const campos = Object.keys(dados).filter(k => k !== 'campos_faltando');
      campos.forEach(campo => {
        const el = document.getElementById(`campo_${campo}`);
        if (el) el.addEventListener('input', atualizarSugestoesCategorias);
      });
    }

    function atualizarSugestoesCategorias() {
      const container = document.getElementById('categorias-lead');
      if (!container || !dadosAtuais) return;
      const campos = Object.keys(dadosAtuais).filter(k => k !== 'campos_faltando');
      const texto = campos.map(c => document.getElementById(`campo_${c}`)?.value || '').join(' ').toLowerCase();
      container.querySelectorAll('.chip-filtro').forEach(botao => {
        const nome = (botao.dataset.nome || '').toLowerCase();
        if (nome && texto.includes(nome)) botao.classList.add('ativo');
      });
    }

    function adicionarNovaCategoriaAoForm() {
      const input = document.getElementById('nova-categoria-lead');
      const nome = input.value.trim();
      if (!nome) return;
      input.value = '';

      const container = document.getElementById('categorias-lead');
      const existente = [...container.querySelectorAll('.chip-filtro')]
        .find(b => (b.dataset.nome || '').toLowerCase() === nome.toLowerCase());
      if (existente) {
        existente.classList.add('ativo');
        return;
      }

      const botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'chip-filtro ativo';
      botao.dataset.nome = nome;
      botao.textContent = nome;
      botao.onclick = () => botao.classList.toggle('ativo');
      container.appendChild(botao);
    }

    async function confirmar(mensagemOriginal, idEdicao) {
      const campos = Object.keys(dadosAtuais).filter(k => k !== 'campos_faltando');
      const payload = {};
      campos.forEach(campo => {
        const valor = document.getElementById(`campo_${campo}`).value;
        payload[campo] = valor === '' ? null : (isNaN(valor) ? valor : Number(valor));
      });
      payload.mensagemOriginal = mensagemOriginal;
      payload.categorias = [...document.querySelectorAll('#categorias-lead .chip-filtro.ativo')].map(b => b.dataset.nome);

      const url = idEdicao ? `/leads/${idEdicao}` : '/leads';
      const metodo = idEdicao ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method: metodo,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (res.status === 401) return verificarSessao();
      const data = await res.json();
      if (data.erro) {
        document.getElementById('resultado').innerHTML = `<p class="erro">Erro: ${data.erro}</p>`;
        return;
      }

      let html = `<div class="card"><h3>${idEdicao ? 'Lead atualizado!' : 'Lead salvo!'}</h3>`;
      if (data.matches && data.matches.length) {
        html += '<p>Matches encontrados:</p>';
        data.matches.forEach(m => {
          html += `<div class="match"><span class="badge badge-${m.papel}">${m.papel}</span>${m.nome || '(sem nome)'} — diferença: ${m.diferenca}</div>`;
        });
      } else {
        html += '<p>Nenhum match encontrado ainda.</p>';
      }
      html += '</div>';
      document.getElementById('resultado').innerHTML = html;

      // recarrega o cache de categorias (pode ter criado uma nova agora)
      await carregarCategorias();
    }
  </script>
</body>
</html>
